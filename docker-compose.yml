
services:
  prestashop:
    image: prestashop/prestashop:8
    container_name: prestashop
    ports:
      - "8080:80"
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: ps_user
      DB_PASSWD: ps_pass
      PS_DOMAIN: auto
    volumes:
      - ps_data:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: prestashop-db
    restart: always
    environment:
      MYSQL_DATABASE: prestashop
      MYSQL_USER: ps_user
      MYSQL_PASSWORD: ps_pass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql

volumes:
  ps_data:
  db_data:
